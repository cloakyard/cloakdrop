<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CloakDrop — Open Graph card</title>
    <!--
      Deterministic source for assets/social/og.png (1200×630). Render with
      scripts/make-og.sh; never hand-edit the PNG.

      The fixed canvas deliberately mirrors the shipped card: brand at upper left,
      a two-line editorial promise, the real app capture at upper right, and an
      adaptive N→1 range diagram across the lower third.
    -->
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 100 900;
        src: url('../../apps/site/public/fonts/archivo-latin.woff2') format('woff2');
      }

      :root {
        --accent: #2A7B9B;
        --paper: #fbf9f5;
        --ink: #16191a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.88), transparent 33%),
          radial-gradient(circle at 89% 83%, rgba(218, 231, 233, 0.2), transparent 30%),
          var(--paper);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      /* A restrained paper grain keeps the warm field from reading as flat fill. */
      .grain {
        position: absolute;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.055;
        pointer-events: none;
      }

      .brand {
        position: absolute;
        top: 64px;
        left: 44px;
        display: flex;
        align-items: center;
        height: 128px;
      }

      .brand-mark {
        width: 130px;
        height: 130px;
        flex: none;
      }

      .wordmark {
        margin-left: 13px;
        font-family: 'Times New Roman', Times, serif;
        font-size: 57px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1;
        white-space: nowrap;
        transform: translateY(-3px) scaleX(0.97);
        transform-origin: left center;
      }

      .wordmark .drop {
        color: var(--accent);
      }

      .headline {
        position: absolute;
        top: 203px;
        left: 53px;
        font-family: 'Times New Roman', Times, serif;
        font-size: 65px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.11;
      }

      .headline span {
        display: block;
        width: max-content;
        white-space: nowrap;
        transform-origin: left center;
      }

      .headline span:first-child {
        transform: scaleX(1.075);
      }

      .headline span:last-child {
        transform: scaleX(0.86);
      }

      .descriptor,
      .domain,
      .merge-label {
        font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--accent);
      }

      .descriptor {
        position: absolute;
        top: 361px;
        left: 57px;
        font-size: 22px;
        font-weight: 460;
        letter-spacing: -0.016em;
      }

      .product-shot {
        position: absolute;
        z-index: -1;
        top: 40px;
        right: 22px;
        width: 624px;
        filter: drop-shadow(0 17px 18px rgba(23, 34, 38, 0.16));
      }

      .product-shot img {
        display: block;
        width: 100%;
        height: 422px;
      }

      .transfer {
        position: absolute;
        top: 444px;
        left: 51px;
        width: 914px;
        height: 137px;
      }

      .transfer-rail {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.15;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .transfer-rail--soft {
        stroke-dasharray: 1.5 2.5;
        opacity: 0.78;
      }

      .source-dot {
        fill: var(--paper);
        stroke: var(--accent);
        stroke-width: 1.2;
      }

      .file-outline {
        fill: rgba(255, 255, 255, 0.28);
        stroke: var(--accent);
        stroke-width: 1.8;
        stroke-linejoin: round;
      }

      .merge-label {
        position: absolute;
        top: 83px;
        left: 836px;
        font-size: 23px;
        font-weight: 470;
        letter-spacing: 0.025em;
        white-space: nowrap;
      }

      .domain {
        position: absolute;
        left: 51px;
        bottom: 20px;
        font-size: 16px;
        font-weight: 520;
        letter-spacing: -0.012em;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="CloakDrop social preview">
      <svg class="grain" aria-hidden="true">
        <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.82"
            numOctaves="3"
            seed="24"
            stitchTiles="stitch"
          />
          <feColorMatrix
            type="matrix"
            values="0 0 0 0 0.32  0 0 0 0 0.35  0 0 0 0 0.36  0 0 0 .16 0"
          />
        </filter>
        <rect width="1200" height="630" filter="url(#paper-grain)" />
      </svg>

      <header class="brand">
        <img class="brand-mark" src="../logo/cloakdrop.svg" alt="" />
        <p class="wordmark"><span>Cloak</span><span class="drop">Drop</span></p>
      </header>

      <h1 class="headline">
        <span>Built to resume.</span>
        <span>Finished with proof.</span>
      </h1>
      <p class="descriptor">Native macOS · Open source</p>

      <figure class="product-shot" aria-label="CloakDrop app window">
        <img src="../screenshots/hero.png" alt="" />
      </figure>

      <div class="transfer" aria-hidden="true">
        <svg viewBox="0 0 914 137" width="914" height="137">
          <defs>
            <marker
              id="arrowhead"
              viewBox="0 0 8 8"
              refX="7"
              refY="4"
              markerWidth="8"
              markerHeight="8"
              orient="auto"
            >
              <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2A7B9B" />
            </marker>
          </defs>

          <g>
            <path class="transfer-rail" d="M 5 10 H 235 M 429 10 C 465 10 449 89 692 89" />
            <path class="transfer-rail" d="M 5 29 H 267 M 429 29 C 465 29 469 89 692 89" />
            <path class="transfer-rail" d="M 5 48 H 218 M 429 48 C 465 48 489 89 692 89" />
            <path class="transfer-rail" d="M 5 67 H 283 M 429 67 C 465 67 510 89 692 89" />
            <path class="transfer-rail" d="M 5 86 H 246 M 429 86 C 465 86 510 89 692 89" />
            <path class="transfer-rail" d="M 5 105 H 290 M 429 105 C 465 105 489 89 692 89" />
            <path class="transfer-rail" d="M 5 124 H 232 M 429 124 C 465 124 469 89 692 89" />

            <path class="transfer-rail transfer-rail--soft" d="M 235 10 H 429" />
            <path class="transfer-rail transfer-rail--soft" d="M 267 29 H 429" />
            <path class="transfer-rail transfer-rail--soft" d="M 218 48 H 429" />
            <path class="transfer-rail transfer-rail--soft" d="M 283 67 H 429" />
            <path class="transfer-rail transfer-rail--soft" d="M 246 86 H 429" />
            <path class="transfer-rail transfer-rail--soft" d="M 290 105 H 429" />
            <path class="transfer-rail transfer-rail--soft" d="M 232 124 H 429" />

            <circle class="source-dot" cx="5" cy="10" r="2.6" />
            <circle class="source-dot" cx="5" cy="29" r="2.6" />
            <circle class="source-dot" cx="5" cy="48" r="2.6" />
            <circle class="source-dot" cx="5" cy="67" r="2.6" />
            <circle class="source-dot" cx="5" cy="86" r="2.6" />
            <circle class="source-dot" cx="5" cy="105" r="2.6" />
            <circle class="source-dot" cx="5" cy="124" r="2.6" />

            <path
              class="transfer-rail"
              d="M 620 89 H 692"
              marker-end="url(#arrowhead)"
            />

            <path class="file-outline" d="M 714 56 H 758 L 779 77 V 131 H 714 Z" />
            <path class="file-outline" d="M 758 56 V 77 H 779" />
          </g>
        </svg>
        <p class="merge-label">N → 1</p>
      </div>

      <p class="domain">drop.cloakyard.com</p>
    </main>
  </body>
</html>
