<!doctype html>
<html lang="en" data-air-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>CloakDrop social preview</title>
    <link rel="stylesheet" href="../../apps/site/src/styles/air.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--air-page);
        color: var(--air-ink);
        font-family: var(--air-font);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 40px 48px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }
      header span {
        margin-left: auto;
        color: var(--air-ink-muted);
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0;
      }
      main {
        position: relative;
        margin: 64px 48px 0;
      }
      .copy {
        width: 450px;
      }
      p {
        margin: 0;
        color: var(--air-ink-secondary);
        font-size: 18px;
        line-height: 1.6;
      }
      h1 {
        margin: 24px 0;
        font-size: 64px;
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.065em;
      }
      h1 span {
        display: block;
        color: var(--air-ink-secondary);
      }
      .description {
        max-width: 350px;
      }
      figure {
        position: absolute;
        left: 476px;
        top: 16px;
        width: 628px;
        margin: 0;
        padding: 12px;
        border: 1px solid var(--air-line);
        border-radius: var(--air-radius-panel);
        background: var(--air-surface-soft);
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      footer {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 32px;
        padding-top: 20px;
        border-top: 1px solid var(--air-line);
        display: flex;
        justify-content: space-between;
        color: var(--air-ink-muted);
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../logo/cloakdrop-mark.svg" width="32" height="32" alt="" />CloakDrop<span
        >drop.cloakyard.com</span
      >
    </header>
    <main>
      <div class="copy">
        <p>Native Mac app. Open source.</p>
        <h1>Your downloads.<span>Under control.</span></h1>
        <p class="description">Parallel transfers, saved progress, and video capture.</p>
      </div>
      <figure>
        <img
          src="../screenshots/hero.png"
          alt="CloakDrop running on macOS with an example download library"
        />
      </figure>
    </main>
    <footer>
      <span>Free · No account · No app telemetry</span><span>Actual app · Example library</span>
    </footer>
  </body>
</html>
