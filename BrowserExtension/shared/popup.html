<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>CloakDrop</title>
  <style>
    :root { color-scheme: light dark; --accent: #5B4CE0; }
    * { box-sizing: border-box; }
    body {
      font: 13px -apple-system, system-ui, "SF Pro Text", "Segoe UI", sans-serif;
      margin: 0;
      width: 340px;
      padding: 14px;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .header img { width: 34px; height: 34px; border-radius: 8px; }
    .header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    #summary { font-size: 12px; margin: 0 0 8px; color: color-mix(in srgb, currentColor 60%, transparent); }
    #count { font-weight: 600; color: inherit; }
    #list { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
    .row {
      display: flex; align-items: center; gap: 9px;
      padding: 8px; border-radius: 9px;
      background: color-mix(in srgb, currentColor 6%, transparent);
    }
    .chip {
      flex: none; width: 52px; text-align: center;
      font-size: 9px; font-weight: 700; letter-spacing: 0.4px;
      padding: 3px 0; border-radius: 5px; color: #fff;
    }
    .chip.stream { background: #C2410C; }
    .chip.video  { background: var(--accent); }
    .chip.audio  { background: #0E7490; }
    .chip.file   { background: #4B5563; }
    .meta { flex: 1; min-width: 0; }
    .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .host { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: color-mix(in srgb, currentColor 50%, transparent); }
    .download {
      flex: none; font: inherit; font-size: 12px; font-weight: 600;
      color: #fff; background: var(--accent); border: 0; border-radius: 7px;
      padding: 6px 11px; cursor: pointer;
    }
    .download:hover { filter: brightness(1.08); }
    .download.sent { background: #16A34A; }
    .download:disabled { cursor: default; opacity: 0.9; }
    #empty p { margin: 6px 0 0; line-height: 1.45; color: color-mix(in srgb, currentColor 62%, transparent); }
    #empty b { color: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon-128.png" alt="">
    <h1>CloakDrop</h1>
  </div>

  <p id="summary" hidden><span id="count">0</span> downloadable item(s) on this page</p>
  <div id="list"></div>

  <div id="empty" hidden>
    <p>No media detected on this page yet.</p>
    <p>Right-click any link, video, image, or audio and choose <b>Download with CloakDrop</b>, or start playing a video and reopen this popup.</p>
    <p>Everything opens in CloakDrop for you to confirm — nothing leaves your Mac.</p>
  </div>

  <script src="media.js"></script>
  <script src="popup.js"></script>
</body>
</html>
