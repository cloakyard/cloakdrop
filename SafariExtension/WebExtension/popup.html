<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>CloakDrop</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 13px -apple-system, system-ui, "SF Pro Text", sans-serif;
      margin: 0;
      width: 260px;
      padding: 16px;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .header img { width: 40px; height: 40px; border-radius: 9px; }
    .header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    p { margin: 6px 0 0; line-height: 1.45; color: color-mix(in srgb, currentColor 62%, transparent); }
    b { color: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon-128.png" alt="">
    <h1>CloakDrop</h1>
  </div>
  <p>Right-click any link, video, image, or audio and choose <b>Download with CloakDrop</b>.</p>
  <p>The download opens in CloakDrop for you to confirm — nothing leaves your Mac.</p>
</body>
</html>
