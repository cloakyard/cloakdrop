name: Mac dependencies and public updates
on:
  schedule:
    - cron: '24 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-mac-dependencies.py
      - if: always()
        run: python3 scripts/check-published-update.py
