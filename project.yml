name: CloakDrop

options:
  bundleIdPrefix: com.cloakyard
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  DownloaderCore:
    path: Packages/DownloaderCore

targets:
  CloakDrop:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloakdrop
        PRODUCT_NAME: CloakDrop
        # Debug uses the team-less entitlements (no App Group); Release adds the App Group below.
        CODE_SIGN_ENTITLEMENTS: App/Resources/CloakDrop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Resources/CloakDrop.Release.entitlements
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: CloakDrop
        CFBundleDisplayName: CloakDrop
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "CloakDrop is part of the Cloakyard privacy-first suite. Runs entirely on-device."
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, fr, de, zh-Hans, ja, ko, pt-BR, ru, ar, hi]
        # Deep-link scheme for one-click capture: cloakdrop://add?url=…&referer=…&filename=…
        CFBundleURLTypes:
          - CFBundleURLName: com.cloakyard.cloakdrop
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - cloakdrop
        # "Send to CloakDrop" Services item: select a link in any app, right-click ▸ Services.
        # Handled in-process by ServicesProvider (registered as NSApp.servicesProvider at launch).
        NSServices:
          - NSMenuItem:
              default: Send to CloakDrop
            NSMessage: sendToCloakDrop
            NSPortName: CloakDrop
            NSSendTypes:
              - public.url
              - public.utf8-plain-text
    dependencies:
      # Bundled Safari Web Extension, embedded into Contents/PlugIns and signed on copy.
      - target: CloakDropSafariExtension
        embed: true
      # Native share-sheet extension ("Share ▸ CloakDrop"), embedded into Contents/PlugIns.
      - target: CloakDropShareExtension
        embed: true
      # Native-messaging host for the Chrome/Edge/Brave/Firefox extension, embedded into
      # Contents/MacOS (resolved at runtime via `Bundle.main.url(forAuxiliaryExecutable:)`) and
      # re-signed on copy so it carries the app's identity/entitlements.
      - target: CloakDropNativeHost
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: DownloaderCore
        product: DownloadModels
      - package: DownloaderCore
        product: DownloadEngine
      - package: DownloaderCore
        product: DownloadPersistence
    postCompileScripts:
      # Bundle the optional, git-ignored static ffmpeg (built by scripts/fetch-ffmpeg.sh) into
      # Contents/MacOS and sign it with the app's identity + inherit entitlements, so it runs in the
      # app's sandbox and FFmpegMuxer.locate() finds it. Runs before Xcode's CodeSign so the app
      # seal covers it. No-ops (with a warning) when the binary isn't present, so a checkout without
      # it still builds — the app just remuxes with AVFoundation.
      - name: Bundle & sign ffmpeg (optional; adds VP9/AV1/Opus muxing)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          FFMPEG_SRC="${SRCROOT}/Vendor/ffmpeg/ffmpeg"
          if [ ! -f "${FFMPEG_SRC}" ]; then
            echo "warning: Vendor/ffmpeg/ffmpeg not found — CloakDrop will remux with AVFoundation only. Run scripts/fetch-ffmpeg.sh to add VP9/AV1/Opus muxing."
            exit 0
          fi
          DEST_DIR="${CODESIGNING_FOLDER_PATH}/Contents/MacOS"
          mkdir -p "${DEST_DIR}"
          cp -f "${FFMPEG_SRC}" "${DEST_DIR}/ffmpeg"
          chmod +x "${DEST_DIR}/ffmpeg"
          ENTITLEMENTS="${SRCROOT}/App/Resources/FFmpegHelper.entitlements"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          NAME="${EXPANDED_CODE_SIGN_IDENTITY_NAME:-}"
          if [ -z "${IDENTITY}" ] || [ "${IDENTITY}" = "-" ] || [ "${NAME}" = "-" ] || [ "${NAME}" = "Sign to Run Locally" ]; then
            # Local / ad-hoc: no hardened-runtime opts, no secure timestamp (needs a real identity + network).
            echo "note: ad-hoc signing bundled ffmpeg"
            codesign --force --sign - --entitlements "${ENTITLEMENTS}" "${DEST_DIR}/ffmpeg"
          else
            # Real identity (Developer ID for distribution): hardened runtime + secure timestamp so it notarizes.
            echo "note: signing bundled ffmpeg with ${NAME}"
            codesign --force --options runtime --timestamp --sign "${IDENTITY}" --entitlements "${ENTITLEMENTS}" "${DEST_DIR}/ffmpeg"
          fi
      # Bundle the optional, git-ignored yt-dlp ONEDIR tree (vendored by scripts/fetch-ytdlp.sh) into
      # Contents/Resources/yt-dlp and sign it, so the sandboxed app can spawn it to resolve page URLs
      # (YouTube & 1800+ sites) into real format tiers — which our own engine then downloads. The tree
      # is the executable + `_internal/` (an unpacked Python runtime): shipping it unpacked (vs. the
      # self-extracting single-file build) is what lets it run under the App Sandbox at all — no temp
      # extraction, no SysV semaphore, no Gatekeeper prompt. No-ops (with a warning) when it isn't
      # vendored, so a checkout without it still builds — page-URL extraction is just disabled. Runs
      # before Xcode's CodeSign so the app seal covers the tree.
      - name: Bundle & sign yt-dlp (optional; adds page-URL extraction for YouTube & 1800+ sites)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Vendor/yt-dlp"
          if [ ! -x "${SRC}/yt-dlp" ] || [ ! -d "${SRC}/_internal" ]; then
            echo "warning: Vendor/yt-dlp not vendored — page-URL extraction (YouTube etc.) is disabled. Run scripts/fetch-ytdlp.sh to enable it."
            exit 0
          fi
          DEST="${CODESIGNING_FOLDER_PATH}/Contents/Resources/yt-dlp"
          rm -rf "${DEST}"; mkdir -p "${DEST}"
          # ditto preserves the framework's symlinks/permissions (cp -R can mangle them).
          ditto "${SRC}/yt-dlp" "${DEST}/yt-dlp"
          ditto "${SRC}/_internal" "${DEST}/_internal"
          chmod +x "${DEST}/yt-dlp"
          ENT="${SRCROOT}/App/Resources/YtDlpHelper.entitlements"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          NAME="${EXPANDED_CODE_SIGN_IDENTITY_NAME:-}"
          if [ -z "${IDENTITY}" ] || [ "${IDENTITY}" = "-" ] || [ "${NAME}" = "-" ] || [ "${NAME}" = "Sign to Run Locally" ]; then
            echo "note: ad-hoc signing bundled yt-dlp tree"
            SIGN=(codesign --force --sign -)
          else
            # Real identity (Developer ID): hardened runtime + secure timestamp. The executable's
            # entitlements carry cs.disable-library-validation so it can load its bundled dylibs.
            echo "note: signing bundled yt-dlp tree with ${NAME}"
            SIGN=(codesign --force --options runtime --timestamp --sign "${IDENTITY}")
          fi
          # Deepest-first: nested dylibs/.so, the Python framework, then the executable (entitled).
          find "${DEST}/_internal" -type f \( -name "*.so" -o -name "*.dylib" \) -exec "${SIGN[@]}" {} +
          [ -d "${DEST}/_internal/Python.framework" ] && "${SIGN[@]}" --deep "${DEST}/_internal/Python.framework"
          "${SIGN[@]}" --entitlements "${ENT}" "${DEST}/yt-dlp"

  # Safari Web Extension: the native "Download with CloakDrop" path. The web half (manifest +
  # background service worker) lives in SafariExtension/WebExtension; the native handler validates
  # the capture and drops it in the shared App Group inbox for the app to pick up.
  CloakDropSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
        excludes:
          - "Info.plist"
          - "CloakDropSafariExtension.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloakdrop.SafariExtension
        PRODUCT_NAME: CloakDropSafariExtension
        PRODUCT_MODULE_NAME: CloakDropSafariExtension
        # Debug: sandbox only (team-less). Release: adds the shared App Group (needs a team).
        CODE_SIGN_ENTITLEMENTS: SafariExtension/CloakDropSafariExtension.entitlements
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: SafariExtension/CloakDropSafariExtension.Release.entitlements
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleName: CloakDrop
        CFBundleDisplayName: CloakDrop
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "CloakDrop is part of the Cloakyard privacy-first suite. Runs entirely on-device."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    dependencies:
      - package: DownloaderCore
        product: DownloadModels

  # Native-messaging host: the bridge for the Chrome/Edge/Brave/Firefox extension (Phase 3c). A tiny
  # stdio helper the browser launches; it validates the capture and drops it in the shared App Group
  # inbox — the same path the Safari extension uses. Deliberately NOT sandboxed (browser-launched),
  # so it ships in the Developer ID build, not the Mac App Store build.
  CloakDropNativeHost:
    type: tool
    platform: macOS
    sources:
      - path: NativeMessagingHost
        excludes:
          - "CloakDropNativeHost.Release.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloakdrop.NativeHost
        PRODUCT_NAME: CloakDropNativeHost
        # Debug: no entitlements — a team-less, non-sandboxed helper. Release: adds the App Group so
        # the browser-launched host can reach the shared inbox (needs a development team).
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: NativeMessagingHost/CloakDropNativeHost.Release.entitlements
          # Defined alongside the App Group entitlement: only then does the host actually share the
          # inbox with the app. In Debug it's absent, so the host reports the inbox unavailable and
          # the extension falls back to cloakdrop:// (see relay() in main.swift).
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_GROUP_INBOX
    dependencies:
      - package: DownloaderCore
        product: DownloadModels

  # Native share-sheet extension: accepts a web URL shared from any app and drops it in the shared
  # inbox for the app to confirm — the same path as the Safari/browser extensions (Phase 3d).
  CloakDropShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
          - "CloakDropShareExtension.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloakdrop.ShareExtension
        PRODUCT_NAME: CloakDropShareExtension
        PRODUCT_MODULE_NAME: CloakDropShareExtension
        # Debug: sandbox only (team-less). Release: adds the shared App Group (needs a team).
        CODE_SIGN_ENTITLEMENTS: ShareExtension/CloakDropShareExtension.entitlements
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: ShareExtension/CloakDropShareExtension.Release.entitlements
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleName: CloakDrop
        CFBundleDisplayName: CloakDrop
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "CloakDrop is part of the Cloakyard privacy-first suite. Runs entirely on-device."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    dependencies:
      - package: DownloaderCore
        product: DownloadModels
